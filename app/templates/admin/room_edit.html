{% extends "base.html" %}
{% block title %}Редактировать — {{ room.title }} — Playground{% endblock %}

{% block body %}
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="/" class="logo-link">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
                Playground
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="/admin">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Панель управления
            </a>
            <a href="/admin/keys">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                Ключи
            </a>
            <a href="/admin/rooms/new">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                Создать комнату
            </a>
            <a href="/admin/settings">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Настройки
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="/admin/logout" class="logout-link">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Выйти
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <a href="/admin/rooms/{{ room.id }}" class="text-sm text-muted">&larr; Назад к комнате</a>
            <h1 class="mt-2">Редактировать комнату</h1>
        </div>

        <form method="post" action="/admin/rooms/{{ room.id }}/edit">
            <div class="card">
                <div class="card-header"><h3>Основное</h3></div>
                <div class="card-content">
                    <div class="form-group">
                        <label class="form-label" for="title">Название комнаты *</label>
                        <input type="text" id="title" name="title" value="{{ room.title }}" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="description">Описание</label>
                        <textarea id="description" name="description" class="large">{{ room.description or '' }}</textarea>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header"><h3>Правила (Rules)</h3></div>
                <div class="card-content">
                    <div class="rules-grid">
                        <div class="form-group">
                            <label class="form-label" for="roles">Роли</label>
                            <input type="text" id="roles" name="roles" value="{{ room.rules.roles if room.rules else '' }}" placeholder="Покупатель, Продавец">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="format">Формат</label>
                            <input type="text" id="format" name="format" value="{{ room.rules.format if room.rules else '' }}" placeholder="Пошаговые переговоры">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="completion_criteria">Критерии завершения</label>
                            <input type="text" id="completion_criteria" name="completion_criteria" value="{{ room.rules.completion_criteria if room.rules else '' }}" placeholder="Достижение соглашения">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="max_messages">Макс. сообщений</label>
                            <input type="number" id="max_messages" name="max_messages" value="{{ room.max_messages }}" min="1">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-4">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/admin/rooms/{{ room.id }}" class="btn btn-outline">Отмена</a>
            </div>
        </form>
    </main>
</div>
{% endblock %}
